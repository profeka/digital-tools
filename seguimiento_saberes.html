<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planificador de saberes y criterios</title>
<style id="neo-base">
/* ================= TOKENS ================= */
:root{
  --ink:#111;            /* texto y bordes */
  --paper:#fff7e0;       /* fondo de página */
  --white:#fff;
  --yellow:#ffe14d;      /* acento principal / cabeceras */
  --orange:#ff8a3d;      /* acción principal */
  --cyan:#6ee7f9;        /* acción secundaria / info */
  --lime:#a3e635;        /* correcto / éxito */
  --pink:#ff7ab8;        /* error / peligro */
  --violet:#c4b5fd;      /* extra / reto */
  --muted:#555;
  --bw:3px;              /* grosor de borde */
  --shadow:6px 6px 0 var(--ink);
  --shadow-sm:4px 4px 0 var(--ink);
  --font:'Trebuchet MS','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Courier New',monospace;
}
/* ================= BASE ================= */
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:var(--paper);
  background-image:radial-gradient(#11111122 1px,transparent 1px);background-size:18px 18px;
  line-height:1.5;min-height:100vh}
h1,h2,h3,h4{font-weight:900;text-transform:uppercase;letter-spacing:-.4px;line-height:1.15}
h1{font-size:clamp(1.5rem,4vw,2.2rem)} h2{font-size:clamp(1.25rem,3vw,1.6rem)} h3{font-size:1.1rem}
p{margin:.5em 0} a{color:var(--ink);font-weight:800;text-decoration-thickness:3px;text-underline-offset:3px}
a:hover{background:var(--yellow)}
code,.mono{font-family:var(--mono)}
code{overflow-wrap:anywhere;background:var(--white);border:2px solid var(--ink);padding:0 5px;font-size:.9em}
:focus-visible{outline:4px solid var(--violet);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)} .grid>*{min-width:0} .g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
/* ================= CABECERA ================= */
.topbar{background:var(--yellow);border-bottom:4px solid var(--ink);padding:14px 20px}
.topbar .inner{max-width:1100px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{width:48px;height:48px;background:var(--white);border:var(--bw) solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;font-size:1.6rem}
.topbar .sub{font-size:.85rem;font-weight:700}
/* ================= TARJETAS ================= */
.card{background:var(--white);border:var(--bw) solid var(--ink);box-shadow:var(--shadow);padding:18px}
.card>h2,.card>h3{margin-bottom:10px}
.card.yellow{background:var(--yellow)} .card.cyan{background:var(--cyan)} .card.pink{background:var(--pink)}
.card.lime{background:var(--lime)} .card.violet{background:var(--violet)} .card.ink{background:var(--ink);color:var(--white)}
.card.flat{box-shadow:none}
.card.ink code{color:var(--ink)}
/* ================= BOTONES ================= */
.btn{font:inherit;font-weight:900;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;
  background:var(--white);color:var(--ink);border:var(--bw) solid var(--ink);box-shadow:var(--shadow-sm);
  padding:10px 18px;transition:transform .08s,box-shadow .08s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{background:#ddd;color:#777;box-shadow:none;cursor:not-allowed}
.btn.primary{background:var(--orange)} .btn.secondary{background:var(--cyan)}
.btn.success{background:var(--lime)} .btn.danger{background:var(--pink)} .btn.yellow{background:var(--yellow)}
.btn.sm{padding:5px 10px;font-size:.8rem} .btn.lg{padding:14px 26px;font-size:1.1rem} .btn.block{width:100%}
/* ================= ETIQUETAS / PÍLDORAS ================= */
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--white);border:var(--bw) solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);padding:3px 10px;font-weight:800;font-size:.85rem}
.pill.yellow{background:var(--yellow)} .pill.lime{background:var(--lime)} .pill.pink{background:var(--pink)}
.pill.cyan{background:var(--cyan)} .pill.violet{background:var(--violet)} .pill.orange{background:var(--orange)}
.tag{display:inline-block;background:var(--yellow);border:var(--bw) solid var(--ink);padding:2px 10px;font-weight:900;font-size:.78rem;text-transform:uppercase;box-shadow:3px 3px 0 var(--ink)}
/* ================= FORMULARIOS ================= */
label{display:block;font-weight:800;margin-bottom:4px}
.input,select.input,textarea.input{font:inherit;width:100%;background:var(--white);color:var(--ink);
  border:var(--bw) solid var(--ink);padding:9px 12px;border-radius:0}
.input:focus{outline:none;box-shadow:4px 4px 0 var(--orange)}
textarea.input{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer}
.check input{appearance:none;width:24px;height:24px;border:var(--bw) solid var(--ink);background:var(--white);display:grid;place-content:center;cursor:pointer;flex:none}
.check input:checked{background:var(--lime)} .check input:checked::after{content:"✓";font-weight:900;line-height:1}
input[type=range]{width:100%;accent-color:var(--orange)}
/* ================= PROGRESO ================= */
.bar{height:24px;background:var(--white);border:var(--bw) solid var(--ink);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--orange);border-right:var(--bw) solid var(--ink);width:0;transition:width .3s}
/* ================= AVISOS ================= */
.note{border:var(--bw) solid var(--ink);padding:10px 14px;font-weight:700;background:var(--cyan)}
.note.ok{background:var(--lime)} .note.warn{background:var(--yellow)} .note.error{background:var(--pink)} .note.info{background:var(--cyan)}
/* ================= PASOS (stepper) ================= */
.steps{display:flex;gap:6px;flex-wrap:wrap;background:var(--white);border-bottom:4px solid var(--ink);padding:10px 20px}
.step{display:flex;gap:8px;align-items:center;padding:4px 10px;font-weight:800;font-size:.9rem;color:var(--muted)}
.step b{display:grid;place-items:center;width:28px;height:28px;border:var(--bw) solid var(--ink);background:var(--white);color:var(--ink)}
.step.active{color:var(--ink);background:#fff3cc} .step.active b{background:var(--orange);box-shadow:3px 3px 0 var(--ink)}
.step.done b{background:var(--lime)}
/* ================= PESTAÑAS ================= */
.tabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:var(--bw) solid var(--ink)}
.tab{font:inherit;font-weight:900;text-transform:uppercase;background:var(--white);border:var(--bw) solid var(--ink);border-bottom:0;margin-right:-3px;padding:8px 16px;cursor:pointer}
.tab[aria-selected=true]{background:var(--yellow)}
.tabpanel{background:var(--white);border:var(--bw) solid var(--ink);border-top:0;padding:16px}
/* ================= OPCIONES (tipo test) ================= */
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:600;background:var(--white);color:var(--ink);
  border:var(--bw) solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){background:var(--yellow)} .opt.good{background:var(--lime)} .opt.bad{background:var(--pink)}
.opt:disabled{cursor:default}
/* ================= TABLA ================= */
table.t{width:100%;border-collapse:collapse;background:var(--white);border:var(--bw) solid var(--ink)}
.t th{background:var(--yellow);text-transform:uppercase;text-align:left;font-weight:900}
.t th,.t td{border:2px solid var(--ink);padding:8px 10px}
.t tr:nth-child(even) td{background:#fffaf0}
.scroll-x{overflow-x:auto}
/* ================= TERMINAL / CÓDIGO ================= */
.term{background:#0b0b0b;color:#e5e5e5;font-family:var(--mono);font-size:.9rem;border:var(--bw) solid var(--ink);box-shadow:var(--shadow-sm);padding:12px 14px;white-space:pre-wrap;overflow-x:auto}
.term .p{color:var(--lime)} .term .e{color:var(--pink)}
/* ================= VENTANA FALSA (para simulaciones) ================= */
.win{background:var(--white);border:var(--bw) solid var(--ink);box-shadow:var(--shadow)}
.win>.bar-title{background:var(--ink);color:var(--white);padding:5px 10px;font-weight:800;font-size:.85rem;display:flex;gap:6px;align-items:center}
.win>.bar-title i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid var(--white)}
.win>.body{padding:14px}
/* ================= MODAL ================= */
.modal-back{position:fixed;inset:0;background:rgba(17,17,17,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--white);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:22px;max-width:620px;width:100%;max-height:92vh;overflow:auto}
/* ================= TÉRMINO (glosario) ================= */
.term-w{background:var(--yellow);border-bottom:2px solid var(--ink);cursor:help;font-weight:700}
/* ================= TOAST ================= */
#toast{position:fixed;right:16px;bottom:16px;background:var(--lime);border:var(--bw) solid var(--ink);box-shadow:var(--shadow-sm);padding:10px 16px;font-weight:900;z-index:60}
/* ================= IMPRESIÓN ================= */
@media print{body{background:#fff}.topbar,.steps,.btn,.no-print{display:none!important}.card{box-shadow:none}}
@media (max-width:600px){.card{padding:14px}.topbar{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="planner">
.layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.layout{grid-template-columns:380px minmax(0,1fr)}.bank{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.bank .tabs{margin-bottom:0}
.grp{margin:14px 0 6px;font-weight:900;font-size:.8rem;text-transform:uppercase;display:flex;gap:6px;align-items:flex-start}
.grp small{font-weight:700;text-transform:none;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:900;font-size:.82rem;border:var(--bw) solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:3px 9px;cursor:grab;background:var(--white);display:inline-flex;gap:6px;align-items:center;user-select:none}
.chip:active{cursor:grabbing}
.chip .n{background:var(--ink);color:var(--white);font-size:.7rem;padding:0 5px;min-width:18px;text-align:center}
.chip.unused{opacity:1} .chip.used{opacity:.55}
.chip.crit{border-style:solid;border-radius:999px}
.chip .x{border:0;background:none;font:inherit;font-weight:900;cursor:pointer;padding:0 0 0 2px}
.c0{background:var(--yellow)} .c1{background:var(--pink)} .c2{background:var(--lime)} .c3{background:var(--orange)} .c4{background:var(--violet)} .c5{background:var(--cyan)} .c6{background:#ffd6a5}
.trim{margin-bottom:22px}
.trim>.row h2{flex:1}
.temas{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));margin-top:12px}
.tema{padding:0;display:flex;flex-direction:column}
.tema .th{background:var(--yellow);border-bottom:var(--bw) solid var(--ink);padding:8px 10px;display:flex;gap:6px;align-items:center}
.tema .th input{font:inherit;font-weight:900;text-transform:uppercase;border:0;background:transparent;flex:1;min-width:0;padding:2px}
.tema .th input:focus{outline:2px solid var(--ink);background:var(--white)}
.zone{padding:10px;min-height:64px;border-bottom:2px dashed var(--ink)}
.zone:last-child{border-bottom:0}
.zone>b{display:block;font-size:.72rem;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}
.zone.over,.tema.over{background:#fff3cc}
.empty-z{font-size:.8rem;color:var(--muted);font-style:italic}
.cov{display:flex;gap:10px;flex-wrap:wrap}
table.t td.ok{background:var(--lime)!important;text-align:center;font-weight:900}
table.t td.no{text-align:center;color:#bbb}
table.t th.rot{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:.75rem}
.t td:first-child{font-weight:800;white-space:nowrap}
.detail{white-space:normal}
.assign{display:grid;gap:8px;margin-top:12px}
.assign .check{border:var(--bw) solid var(--ink);padding:8px 10px;background:var(--white)}
.legend{font-size:.85rem;color:var(--muted);font-weight:700}
@media print{.bank,.no-print{display:none!important}.layout{display:block}}
</style>
</head>
<body>

<header class="topbar">
  <div class="inner">
    <div class="logo">🗓️</div>
    <div>
      <h1>Planificador de saberes y criterios</h1>
      <div class="sub" id="sub">Currículo de la Comunidad de Madrid</div>
    </div>
    <div class="spacer"></div>
    <select id="materia" class="input" style="width:auto;max-width:100%;font-weight:800" aria-label="Materia y curso"></select>
  </div>
</header>

<main class="wrap">
  <div class="row no-print" style="margin-bottom:18px">
    <div class="tabs" role="tablist" style="border-bottom:0">
      <button class="tab" role="tab" aria-selected="true" data-view="plan">🧩 Planificación</button>
      <button class="tab" role="tab" aria-selected="false" data-view="matriz">📊 Matriz y cobertura</button>
      <button class="tab" role="tab" aria-selected="false" data-view="curr">📖 Currículo</button>
    </div>
    <span class="spacer"></span>
    <button class="btn sm success" id="export">📥 Exportar JSON</button>
    <button class="btn sm secondary" id="import">📂 Importar JSON</button>
    <button class="btn sm danger" id="reset">↺ Vaciar</button>
    <input type="file" id="file" accept="application/json,.json" class="hidden">
  </div>

  <!-- VISTA PLANIFICACIÓN -->
  <section id="v-plan" class="layout">
    <aside class="card bank" aria-label="Banco">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-bank="saberes">Saberes</button>
        <button class="tab" role="tab" aria-selected="false" data-bank="criterios">Criterios</button>
      </div>
      <p class="legend" style="margin-top:10px">Arrastra a un tema o pulsa para ver el texto y asignarlo. El número indica en cuántos temas está.</p>
      <div id="bank"></div>
    </aside>
    <div id="board"></div>
  </section>

  <!-- VISTA MATRIZ -->
  <section id="v-matriz" class="hidden grid"></section>

  <!-- VISTA CURRÍCULO -->
  <section id="v-curr" class="hidden grid"></section>
</main>

<div id="modal" class="modal-back hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal" role="dialog" aria-modal="true" id="modal-body"></div>
</div>
<div id="toast" class="hidden"></div>

<script id="curriculo-data">
/* Currículo extraído de los Decretos 65/2022 (ESO) y 64/2022 (Bachillerato) de la Comunidad de Madrid.
   Estructura: [{id, materia, curso, decreto, notas?, competencias:[{id, texto, criterios:[{id, texto}]}], bloques:[{id, titulo, items:[{id, texto}]}]}] */
const CURRICULO = [
 {
  "id": "cc-1eso",
  "materia": "Ciencias de la Computación",
  "curso": "1º ESO",
  "decreto": "Decreto 65/2022, de 20 de julio (Comunidad de Madrid)",
  "competencias": [
   {
    "id": "1",
    "texto": "Entender y utilizar algoritmos que lleven a la resolución de problemas concretos, aplicando los principios del pensamiento computacional y el razonamiento lógico.",
    "criterios": [
     {
      "id": "1.1",
      "texto": "Comprender qué es un algoritmo, hacer uso de ellos para la resolución de problemas simples y representarlos mediante diagramas de flujo."
     },
     {
      "id": "1.2",
      "texto": "Utilizar el razonamiento lógico para explicar cómo funcionan algunos algoritmos básicos y también para detectar y corregir errores en ellos."
     },
     {
      "id": "1.3",
      "texto": "Usar secuencias, selecciones y repeticiones en algoritmos que lleven a la resolución de problemas."
     }
    ]
   },
   {
    "id": "2",
    "texto": "Diseñar, escribir y depurar aplicaciones informáticas, en entornos de programación gráfica y textual, que den solución a problemas concretos, incluyendo el control de sistemas físicos y robóticos.",
    "criterios": [
     {
      "id": "2.1",
      "texto": "Diseñar e implementar mediante un lenguaje de programación por bloques, programas que realicen tareas diversas como animaciones, historias, juegos de preguntas y respuestas o videojuegos simples, que incluyan interacción con el usuario."
     },
     {
      "id": "2.2",
      "texto": "Usar las secuencias, la selección y la repetición en programas, trabajando con objetos, variables, y diversas formas de entrada y salida."
     },
     {
      "id": "2.3",
      "texto": "Coordinar la ejecución de tareas diferentes en un programa mediante eventos y mensajes a objetos."
     },
     {
      "id": "2.4",
      "texto": "Elaborar aplicaciones para dispositivos móviles haciendo uso de la programación por bloques y utilizando las posibilidades que ofrecen en cuanto a comunicaciones y al uso de los sensores que incorporan, valorando especialmente el diseño de la interfaz de usuario para lograr una experiencia accesible y segura."
     },
     {
      "id": "2.5",
      "texto": "Integrar gráficos, sonidos y otros elementos multimedia en los programas."
     }
    ]
   },
   {
    "id": "3",
    "texto": "Conocer los elementos componentes, tanto hardware como software, de los distintos sistemas informáticos, valorando la importancia de su mantenimiento y actualización, así como la manera en la que la información es tratada y almacenada en ellos.",
    "criterios": [
     {
      "id": "3.1",
      "texto": "Describir la función de los principales elementos componentes de un ordenador, valorando la importancia de una correcta elección de los mismos en función del uso que se les vaya a dar."
     },
     {
      "id": "3.2",
      "texto": "Comprender cómo se conectan los componentes de un ordenador y cómo se procesa y almacena la información."
     },
     {
      "id": "3.3",
      "texto": "Describir las funciones principales de los sistemas operativos, así como valorar la elección del mismo entre las diferentes opciones disponibles, prestando especial atención a factores como su facilidad de instalación, su mantenimiento y su uso seguro, protegiendo la privacidad de las personas y datos."
     },
     {
      "id": "3.4",
      "texto": "Organizar la información de manera segura dentro de dispositivos de almacenamiento y en la nube, haciendo un uso adecuado de operaciones como mover, copiar o cortar archivos, así como guardándola en el formato más adecuado para cada tipo de documento."
     },
     {
      "id": "3.5",
      "texto": "Conocer la existencia de diferentes tipos de software para la realización de tareas tales como el tratamiento de imágenes, ofimáticas, entretenimiento y comunicaciones."
     },
     {
      "id": "3.6",
      "texto": "Utilizar software de edición de imágenes para crear y modificar gráficos vectoriales y de mapas de bits."
     }
    ]
   },
   {
    "id": "4",
    "texto": "Comprender cómo los equipos informáticos se comunican entre sí formando redes, desde las más pequeñas hasta internet, para compartir información, servicios y recursos, siendo conscientes de las amenazas que esto conlleva y de la importancia de la ciberseguridad.",
    "criterios": [
     {
      "id": "4.1",
      "texto": "Reconocer los elementos y componentes de las redes informáticas, incluido los de Internet."
     },
     {
      "id": "4.2",
      "texto": "Conectar equipos informáticos a todo tipo de redes."
     },
     {
      "id": "4.3",
      "texto": "Conocer y utilizar de forma segura los diferentes servicios que ofrecen las redes, así como las oportunidades que ofrecen para la comunicación y el trabajo colaborativo."
     }
    ]
   }
  ],
  "bloques": [
   {
    "id": "A",
    "titulo": "Pensamiento computacional",
    "items": [
     {
      "texto": "Algoritmos: Definición y ejemplos sencillos. · Análisis de problemas simples y diseño de algoritmos para su resolución. · Representación de algoritmos mediante diagramas de flujo.",
      "id": "A.1"
     },
     {
      "texto": "Detección y corrección de errores en algoritmos haciendo uso del razonamiento lógico.",
      "id": "A.2"
     },
     {
      "texto": "Pensamiento computacional: Concepto y fundamentos. · Técnicas de resolución de problemas: descomposición de problemas complejos en otros más pequeños, identificación de patrones repetitivos y secuenciación de operaciones.",
      "id": "A.3"
     }
    ]
   },
   {
    "id": "B",
    "titulo": "Programación",
    "items": [
     {
      "texto": "Lenguajes de programación: definición.",
      "id": "B.1"
     },
     {
      "texto": "Tipos de lenguajes de programación. Características.",
      "id": "B.2"
     },
     {
      "texto": "Fundamentos de la programación por bloques: Uso de variables (tipos y operaciones). · Estructuras de control (secuencias de instrucciones, bucles, condicionales y eventos). · Integración de gráficos y sonidos. · Ejecución simultánea de varios objetos, clones y comunicación entre ellos.",
      "id": "B.3"
     },
     {
      "texto": "Programación por bloques de animaciones, presentaciones y videojuegos sencillos.",
      "id": "B.4"
     },
     {
      "texto": "Programación por bloques de aplicaciones para dispositivos móviles: Programación orientada a eventos. · Diseño de la interfaz de usuario. · Uso de sensores de los dispositivos móviles.",
      "id": "B.5"
     }
    ]
   },
   {
    "id": "C",
    "titulo": "Computadores",

    ]
   },
   {
    "id": "C",
    "titulo": "Sistemas mecánicos",
    "items": [
     {
      "texto": "Descripción y elementos de estructuras sencillas: En edificación: cimentación, pórticos (pilares y vigas), cerchas. · En maquinaria: chasis y bastidores, bancadas.",
      "id": "C.1"
     },
     {
      "texto": "Estabilidad y cálculos básicos de estructuras: Tipos de cargas: puntual y uniformemente repartida. · Tipos de apoyos y uniones: empotramientos, apoyos fijos y articulados. · Cálculo de esfuerzos en vigas simplemente apoyadas sometidas a cargas puntuales y/o uniformemente repartidas. Diagramas de esfuerzos cortantes y de flexión. · Cálculo de los esfuerzos de compresión y/o tracción en estructuras isostáticas de barras articuladas. Diagrama de Cremona. · Montaje o simulación de ejemplos sencillos.",
      "id": "C.2"
     },
     {
      "texto": "Máquinas térmicas: Máquina frigorífica, bomba de calor y motores térmicos. Elementos y fundamentos físicos de funcionamiento. · Cálculos básicos de potencia, energía útil, par motor y rendimiento. · Simulación y aplicaciones.",
      "id": "C.3"
     },
     {
      "texto": "Neumática e hidráulica: Principios físicos en neumática. El aire, ley de los gases perfectos, magnitudes y unidades básicas. · Principios físicos en hidráulica: presión hidráulica (principio de Pascal), principio de Bernouilli, efecto Venturi, magnitudes y unidades básicas. · Componentes: compresor (neumática), depósito y bomba (hidráulica), sistemas de mantenimiento, cilindros neumáticos e hidráulicos, motores, válvulas, tuberías. Descripción y análisis. · Esquemas característicos de aplicación. · Diseño y montaje físico o simulado.",
      "id": "C.4"
     }
    ]
   },
   {
    "id": "D",
    "titulo": "Sistemas eléctricos y electrónicos",
    "items": [
     {
      "texto": "Circuitos de corriente alterna: Generación de la corriente alterna. · Valores instantáneos, medios y eficaces. Diagrama de Fresnel. · Ley de Ohm en corriente alterna. Impedancia, factor de potencia. Triángulo de potencias. · Cálculo, montaje o simulación.",
      "id": "D.1"
     },
     {
      "texto": "Electrónica digital combinacional: Puertas lógicas: NOT, AND, OR. · Álgebra de Boole. Diseño y simplificación: mapas de Karnaugh. · Experimentación en simuladores.",
      "id": "D.2"

     {
      "texto": "Electrónica digital secuencial. Experimentación en simuladores.",
      "id": "D.3"

    ]
   },
   {
    "id": "E",
    "titulo": "Sistemas informáticos emergentes",
    "items": [
     {
      "texto": "Fundamentos de la inteligencia artificial. Tipos: máquinas reactivas, memoria limitada, teoría de la mente y autoconciencia.",
      "id": "E.1"
     },
     {
      "texto": "Características fundamentales del big data: volumen, velocidad, variedad de los datos, veracidad de los datos, viabilidad, visualización de los datos y valor. Bases de datos distribuidas. Bases de datos relacionales.",
      "id": "E.2"
     },
     {
      "texto": "La ciberseguridad a nivel de usuario. Concepto, amenazas, medidas básicas de protección.",
      "id": "E.3"
     }
    ]
   },
   {
    "id": "F",
    "titulo": "Sistemas automáticos",
    "items": [
     {
      "texto": "Sistemas en lazo abierto y cerrado. Álgebra de bloques y simplificación de sistemas.",
      "id": "F.1"
     },
     {
      "texto": "Estabilidad. Experimentación en simuladores.",
      "id": "F.2"
     }
    ]
   },
   {
    "id": "G",
    "titulo": "Tecnología sostenible",
    "items": [
     {
      "texto": "Impacto social y ambiental. Valoración crítica de las tecnologías desde el punto de vista de la sostenibilidad.",
      "id": "G.1"
     },
     {
      "texto": "Informes de evaluación de impacto ambiental.",

   }

 }
];
</script>

<script>
/* ======================= ESTADO ======================= */
const STORE_KEY = 'planificador-saberes-v2';
const TRIMESTRES = [1, 2, 3];
let store = {};                       // { materiaId: { temas: [{uid, nombre, trimestre, saberes:[ids], criterios:[ids]}] } }
let current = null;                   // materia actual
let bankTab = 'saberes';
let view = 'plan';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);

function load(){ try { store = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ store = {}; } }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){} }
function plan(){ return store[current.id] ||= { temas: [] }; }

/* Índices del currículo actual */
let SAB = {}, CRIT = {}, BLOQUE_IDX = {}, COMP_IDX = {};
function indexMateria(){
  SAB = {}; CRIT = {}; BLOQUE_IDX = {}; COMP_IDX = {};
  current.bloques.forEach((b, i) => { BLOQUE_IDX[b.id] = i; b.items.forEach(it => SAB[it.id] = { ...it, bloque: b }); });
  current.competencias.forEach((c, i) => { COMP_IDX[c.id] = i; c.criterios.forEach(k => CRIT[k.id] = { ...k, comp: c }); });
}
const colorSab = id => 'c' + (BLOQUE_IDX[id.split('.')[0]] % 7);
const colorCrit = id => 'c' + (COMP_IDX[id.split('.')[0]] % 7);
const uses = (kind, id) => plan().temas.filter(t => t[kind].includes(id)).length;

/* ======================= RENDER ======================= */
function chip(kind, id, opts = {}){
  const isS = kind === 'saberes';
  const full = isS ? SAB[id]?.texto : CRIT[id]?.texto;
  if (!full) return '';
  const n = uses(kind, id);
  return `<span class="chip ${isS ? colorSab(id) : 'crit ' + colorCrit(id)} ${opts.bank ? (n ? 'used' : 'unused') : ''}"
      draggable="true" data-kind="${kind}" data-id="${id}" ${opts.from ? `data-from="${opts.from}"` : ''} title="${esc(full)}" tabindex="0">
      ${isS ? '' : 'CE '}${id}${opts.bank ? `<span class="n">${n}</span>` : ''}
      ${opts.from ? `<button class="x" data-remove="${opts.from}" aria-label="Quitar">×</button>` : ''}</span>`;
}

function renderBank(){
  document.querySelectorAll('[data-bank]').forEach(b => b.setAttribute('aria-selected', b.dataset.bank === bankTab));
  let h = '';
  if (bankTab === 'saberes'){
    current.bloques.forEach(b => {
      h += `<div class="grp"><span class="pill ${colorSab(b.id + '.1')}" style="box-shadow:none;padding:0 6px">${b.id}</span> <span>${esc(b.titulo)}</span></div>
            <div class="chips">${b.items.map(it => chip('saberes', it.id, { bank: true })).join('')}</div>`;
    });
  } else {
    current.competencias.forEach(c => {
      h += `<div class="grp"><span class="pill ${colorCrit(c.id + '.1')}" style="box-shadow:none;padding:0 6px">CE${c.id}</span> <small>${esc(c.texto.slice(0, 110))}${c.texto.length > 110 ? '…' : ''}</small></div>
            <div class="chips">${c.criterios.map(k => chip('criterios', k.id, { bank: true })).join('')}</div>`;
    });
  }
  $('#bank').innerHTML = h;
}

function renderBoard(){
  const temas = plan().temas;
  $('#board').innerHTML = TRIMESTRES.map(tr => `
    <section class="trim">
      <div class="row"><h2>Trimestre ${tr}</h2><button class="btn sm primary no-print" data-add="${tr}">+ Añadir tema</button></div>
      <div class="temas">
        ${temas.filter(t => t.trimestre === tr).map(t => `
          <article class="card tema" data-tema="${t.uid}">
            <div class="th">
              <input value="${esc(t.nombre)}" data-rename="${t.uid}" aria-label="Nombre del tema">
              <select class="input" data-move="${t.uid}" style="width:auto;padding:2px 4px;font-size:.8rem" aria-label="Trimestre">
                ${TRIMESTRES.map(x => `<option value="${x}" ${x === tr ? 'selected' : ''}>T${x}</option>`).join('')}
              </select>
              <button class="btn sm danger" data-del="${t.uid}" aria-label="Eliminar tema">🗑</button>
            </div>
            <div class="zone" data-zone="saberes" data-tema="${t.uid}"><b>Saberes (${t.saberes.length})</b>
              <div class="chips">${t.saberes.map(id => chip('saberes', id, { from: t.uid })).join('') || '<span class="empty-z">Arrastra aquí saberes</span>'}</div></div>
            <div class="zone" data-zone="criterios" data-tema="${t.uid}"><b>Criterios (${t.criterios.length})</b>
              <div class="chips">${t.criterios.map(id => chip('criterios', id, { from: t.uid })).join('') || '<span class="empty-z">Arrastra aquí criterios</span>'}</div></div>
          </article>`).join('') || '<p class="empty-z">Sin temas todavía.</p>'}
      </div>
    </section>`).join('');
}

function coverage(){
  const p = plan().temas;
  const sabOut = Object.keys(SAB).filter(id => !p.some(t => t.saberes.includes(id)));
  const critOut = Object.keys(CRIT).filter(id => !p.some(t => t.criterios.includes(id)));
  return { sabOut, critOut };
}

function renderMatriz(){
  const temas = [...plan().temas].sort((a, b) => a.trimestre - b.trimestre);
  const { sabOut, critOut } = coverage();
  const nS = Object.keys(SAB).length, nC = Object.keys(CRIT).length;
  const table = (kind, rows) => `<div class="scroll-x"><table class="t"><thead><tr><th>${kind === 'saberes' ? 'Saber' : 'Criterio'}</th>
      ${temas.map(t => `<th class="rot" title="T${t.trimestre}">T${t.trimestre} · ${esc(t.nombre)}</th>`).join('')}<th>Nº</th></tr></thead><tbody>
      ${rows.map(r => { const n = temas.filter(t => t[kind].includes(r.id)).length;
        return `<tr><td title="${esc(r.texto)}">${kind === 'criterios' ? 'CE ' : ''}${r.id}</td>${temas.map(t => t[kind].includes(r.id) ? '<td class="ok">✓</td>' : '<td class="no">·</td>').join('')}
        <td style="text-align:center;font-weight:900;${n ? '' : 'background:var(--pink)'}">${n}</td></tr>`; }).join('')}</tbody></table></div>`;
  $('#v-matriz').innerHTML = `
    <div class="cov">
      <span class="pill ${critOut.length ? 'pink' : 'lime'}">Criterios cubiertos: ${nC - critOut.length}/${nC}</span>
      <span class="pill ${sabOut.length ? 'pink' : 'lime'}">Saberes cubiertos: ${nS - sabOut.length}/${nS}</span>
      <span class="pill">Temas: ${temas.length}</span>
    </div>
    ${critOut.length ? `<div class="note warn">⚠️ Criterios sin tema: ${critOut.map(id => 'CE ' + id).join(', ')}</div>` : '<div class="note ok">✅ Todos los criterios están en algún tema.</div>'}
    ${sabOut.length ? `<div class="note warn">⚠️ Saberes sin tema: ${sabOut.join(', ')}</div>` : '<div class="note ok">✅ Todos los saberes están en algún tema.</div>'}
    ${temas.length ? `<section class="card"><h3>Criterios × temas</h3>${table('criterios', Object.values(CRIT))}</section>
    <section class="card"><h3>Saberes × temas</h3>${table('saberes', Object.values(SAB))}</section>` : '<p class="empty-z">Crea temas en la pestaña de planificación para ver la matriz.</p>'}`;
}

function renderCurr(){
  $('#v-curr').innerHTML = `
    <section class="card yellow"><span class="tag">${esc(current.curso)}</span><h2 style="margin-top:8px">${esc(current.materia)}</h2>
      <p>${esc(current.decreto)}</p>${current.notas ? `<div class="note info">💡 ${esc(current.notas)}</div>` : ''}</section>
    <section class="card"><h3>Competencias específicas y criterios de evaluación</h3>
      ${current.competencias.map(c => `<div style="margin-top:14px"><p><span class="pill ${colorCrit(c.id + '.1')}">CE${c.id}</span> <strong>${esc(c.texto)}</strong></p>
        <ul style="margin:6px 0 0 18px">${c.criterios.map(k => `<li><strong>${k.id}</strong> ${esc(k.texto)}</li>`).join('')}</ul></div>`).join('')}</section>
    <section class="card"><h3>Saberes básicos</h3>
      ${current.bloques.map(b => `<div style="margin-top:14px"><p><span class="pill ${colorSab(b.id + '.1')}">${b.id}</span> <strong>${esc(b.titulo)}</strong></p>
        <ul style="margin:6px 0 0 18px">${b.items.map(it => `<li><strong>${it.id}</strong> ${esc(it.texto)}</li>`).join('')}</ul></div>`).join('')}</section>`;
}

function render(){
  $('#sub').textContent = `${current.materia} · ${current.curso} · Comunidad de Madrid`;
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-selected', b.dataset.view === view));
  ['plan', 'matriz', 'curr'].forEach(v => $('#v-' + v).classList.toggle('hidden', v !== view));
  if (view === 'plan'){ renderBank(); renderBoard(); }
  if (view === 'matriz') renderMatriz();
  if (view === 'curr') renderCurr();
}
const commit = () => { save(); render(); };

/* ======================= ACCIONES ======================= */
const temaById = u => plan().temas.find(t => t.uid === u);
function assign(kind, id, temaUid, on = true){
  const t = temaById(temaUid); if (!t) return;
  const has = t[kind].includes(id);
  if (on && !has){ t[kind].push(id); t[kind].sort((a, b) => a.localeCompare(b, 'es', { numeric: true })); }
  if (!on && has) t[kind] = t[kind].filter(x => x !== id);
}
function addTema(tr){
  const n = plan().temas.length + 1;
  plan().temas.push({ uid: uid(), nombre: `Tema ${n}`, trimestre: tr, saberes: [], criterios: [] });
  commit();
}

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), 2200); }
function closeModal(){ $('#modal').classList.add('hidden'); }
function openModal(html){ $('#modal-body').innerHTML = html; $('#modal').classList.remove('hidden'); }

function openDetail(kind, id){
  const isS = kind === 'saberes', d = isS ? SAB[id] : CRIT[id];
  const temas = plan().temas;
  openModal(`
    <span class="tag">${isS ? 'Saber básico · Bloque ' + d.bloque.id : 'Criterio · CE' + d.comp.id}</span>
    <h2 style="margin:10px 0">${isS ? '' : 'CE '}${id}</h2>
    <p class="detail">${esc(d.texto)}</p>
    <p class="legend" style="margin-top:8px">${isS ? esc(d.bloque.titulo) : 'Competencia ' + d.comp.id + ': ' + esc(d.comp.texto)}</p>
    <h3 style="margin-top:16px">Asignar a temas</h3>
    ${temas.length ? `<div class="assign">${[...temas].sort((a, b) => a.trimestre - b.trimestre).map(t => `
      <label class="check"><input type="checkbox" data-assign="${t.uid}" ${t[kind].includes(id) ? 'checked' : ''}> T${t.trimestre} · ${esc(t.nombre)}</label>`).join('')}</div>`
      : '<div class="note warn">Primero crea un tema en algún trimestre.</div>'}
    <p class="row" style="margin-top:16px"><span class="spacer"></span><button class="btn primary" onclick="closeModal()">Hecho</button></p>`);
  $('#modal-body').querySelectorAll('[data-assign]').forEach(cb => cb.onchange = () => { assign(kind, id, cb.dataset.assign, cb.checked); commit(); });
}

/* ======================= EXPORTAR / IMPORTAR ======================= */
function buildExport(){
  const temas = plan().temas;
  const sabFull = id => ({ id, texto: SAB[id].texto, bloque: { id: SAB[id].bloque.id, titulo: SAB[id].bloque.titulo } });
  const critFull = id => ({ id, texto: CRIT[id].texto, competencia: { id: CRIT[id].comp.id, texto: CRIT[id].comp.texto } });
  const { sabOut, critOut } = coverage();
  return {
    formato: 'planificador-saberes-criterios',
    version: 2,
    exportado: new Date().toISOString(),
    materia: { id: current.id, materia: current.materia, curso: current.curso, decreto: current.decreto, ...(current.notas ? { notas: current.notas } : {}) },
    trimestres: TRIMESTRES.map(tr => ({
      trimestre: tr,
      temas: temas.filter(t => t.trimestre === tr).map(t => ({
        nombre: t.nombre,
        saberes: t.saberes.filter(id => SAB[id]).map(sabFull),
        criterios: t.criterios.filter(id => CRIT[id]).map(critFull)
      }))
    })),
    relaciones: {
      criterios: Object.keys(CRIT).map(id => {
        const ts = temas.filter(t => t.criterios.includes(id));
        return { criterio: id, temas: ts.map(t => ({ trimestre: t.trimestre, nombre: t.nombre })), saberes: [...new Set(ts.flatMap(t => t.saberes))] };
      }),
      saberes: Object.keys(SAB).map(id => {
        const ts = temas.filter(t => t.saberes.includes(id));
        return { saber: id, temas: ts.map(t => ({ trimestre: t.trimestre, nombre: t.nombre })), criterios: [...new Set(ts.flatMap(t => t.criterios))] };
      })
    },
    cobertura: {
      criterios: { total: Object.keys(CRIT).length, sin_asignar: critOut },
      saberes: { total: Object.keys(SAB).length, sin_asignar: sabOut }
    },
    curriculo: { competencias: current.competencias, bloques: current.bloques }
  };
}
function download(obj, name){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(data){
  // Formato nuevo
  if (data && data.formato === 'planificador-saberes-criterios'){
    const m = CURRICULO.find(c => c.id === data.materia?.id);
    if (!m) throw new Error('Materia desconocida');
    store[m.id] = { temas: data.trimestres.flatMap(tr => tr.temas.map(t => ({
      uid: uid(), nombre: t.nombre, trimestre: tr.trimestre,
      saberes: (t.saberes || []).map(s => typeof s === 'string' ? s : s.id),
      criterios: (t.criterios || []).map(k => typeof k === 'string' ? k : k.id) }))) };
    return m.id;
  }
  // Formato antiguo {T1:[{tema, saberes:["s-a-1"]}], T2, T3} → Tecnología y Digitalización 2º ESO
  if (data && (data.T1 || data.T2 || data.T3)){
    const conv = id => id.replace(/^s-([a-z])-(\d+)$/, (_, b, n) => b.toUpperCase() + '.' + n);
    store['tyd-2eso'] = { temas: TRIMESTRES.flatMap(tr => (data['T' + tr] || []).map(t => ({
      uid: uid(), nombre: t.tema, trimestre: tr, saberes: (t.saberes || []).map(conv), criterios: [] }))) };
    return 'tyd-2eso';
  }
  throw new Error('Formato no reconocido');
}

/* ======================= EVENTOS ======================= */
function setMateria(id){ current = CURRICULO.find(c => c.id === id) || CURRICULO[0]; $('#materia').value = current.id; indexMateria(); try { localStorage.setItem(STORE_KEY + '-materia', current.id); } catch(e){} render(); }

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-view]')){ view = t.closest('[data-view]').dataset.view; render(); return; }
  if (t.closest('[data-bank]')){ bankTab = t.closest('[data-bank]').dataset.bank; renderBank(); return; }
  if (t.dataset.add){ addTema(+t.dataset.add); return; }
  if (t.dataset.del){
    const tm = temaById(t.dataset.del);
    openModal(`<span class="tag">Eliminar</span><h2 style="margin:10px 0">¿Eliminar «${esc(tm.nombre)}»?</h2><p>Se quitarán sus saberes y criterios asignados.</p>
      <p class="row" style="margin-top:14px"><button class="btn secondary" onclick="closeModal()">Cancelar</button><span class="spacer"></span><button class="btn danger" id="confirm-del">Eliminar</button></p>`);
    $('#confirm-del').onclick = () => { plan().temas = plan().temas.filter(x => x.uid !== tm.uid); closeModal(); commit(); };
    return;
  }
  if (t.dataset.remove){ const c = t.closest('.chip'); assign(c.dataset.kind, c.dataset.id, t.dataset.remove, false); commit(); return; }
  const c = t.closest('.chip');
  if (c) openDetail(c.dataset.kind, c.dataset.id);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.classList?.contains('chip')) openDetail(e.target.dataset.kind, e.target.dataset.id);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rename){ temaById(t.dataset.rename).nombre = t.value.trim() || 'Sin nombre'; commit(); }
  if (t.dataset.move){ temaById(t.dataset.move).trimestre = +t.value; commit(); }
});

/* Arrastrar y soltar */
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('.chip'); if (!c) return;
  e.dataTransfer.setData('text/plain', JSON.stringify({ kind: c.dataset.kind, id: c.dataset.id, from: c.dataset.from || null }));
  e.dataTransfer.effectAllowed = 'copyMove';
});
document.addEventListener('dragover', e => { const z = e.target.closest?.('.tema, #bank'); if (z){ e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest?.('.tema, #bank'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', e => {
  const z = e.target.closest?.('.tema, #bank'); if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  let d; try { d = JSON.parse(e.dataTransfer.getData('text/plain')); } catch(_) { return; }
  if (z.id === 'bank'){ if (d.from){ assign(d.kind, d.id, d.from, false); commit(); } return; }   // soltar en el banco = quitar
  const to = z.dataset.tema;
  if (d.from && d.from !== to && !e.altKey) assign(d.kind, d.id, d.from, false);                // mover entre temas
  assign(d.kind, d.id, to, true); commit();
});

$('#materia').onchange = e => setMateria(e.target.value);
$('#export').onclick = () => {
  const data = buildExport();
  const name = `planificacion_${current.id}_${new Date().toISOString().slice(0, 10)}.json`;
  download(data, name); toast('JSON exportado ✓');
};
$('#import').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try { const id = importData(JSON.parse(ev.target.result)); save(); setMateria(id); toast('Planificación importada ✓'); }
    catch(err){ openModal(`<div class="note error">❌ No se ha podido importar: ${esc(err.message)}</div><p class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn" onclick="closeModal()">Cerrar</button></p>`); }
    e.target.value = '';
  };
  r.readAsText(f);
};
$('#reset').onclick = () => {
  openModal(`<span class="tag">Vaciar</span><h2 style="margin:10px 0">¿Vaciar la planificación de ${esc(current.materia)} (${esc(current.curso)})?</h2><p>Se borrarán todos sus temas. Exporta antes el JSON si quieres conservarla.</p>
    <p class="row" style="margin-top:14px"><button class="btn secondary" onclick="closeModal()">Cancelar</button><span class="spacer"></span><button class="btn danger" id="confirm-reset">Vaciar</button></p>`);
  $('#confirm-reset').onclick = () => { store[current.id] = { temas: [] }; closeModal(); commit(); };
};

/* ======================= INICIO ======================= */
$('#materia').innerHTML = CURRICULO.map(c => `<option value="${c.id}">${esc(c.curso)} · ${esc(c.materia)}</option>`).join('');
load();
let last = null; try { last = localStorage.getItem(STORE_KEY + '-materia'); } catch(e){}
setMateria(last || 'tyd-2eso');
</script>
</body>
